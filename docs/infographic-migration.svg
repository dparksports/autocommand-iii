<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="640" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The engine migration — C# cores → F# engines</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#475569">same app, same behavior, same self-tests — the engine layer changed language</text>

  <!-- Before / After bars -->
  <text x="80" y="96" font-size="14" font-weight="700" fill="#0f172a">Core-library code by language (lines)</text>

  <!-- scale: 26544 -> 660px -->
  <g font-size="12">
    <!-- before -->
    <text x="80" y="128" font-weight="700" fill="#334155">autocommand-ii (before)</text>
    <rect x="230" y="114" width="660" height="22" rx="4" fill="#3b82f6"/>
    <text x="898" y="130" text-anchor="end" fill="#ffffff" font-weight="700">C# 26,544</text>

    <!-- after -->
    <text x="80" y="166" font-weight="700" fill="#334155">autocommand-iii (after)</text>
    <rect x="230" y="152" width="314" height="22" rx="4" fill="#22c55e"/>
    <text x="549" y="168" fill="#ffffff" font-weight="700">C# 12,606</text>
    <rect x="548" y="152" width="342" height="22" rx="4" fill="#f59e0b"/>
    <text x="898" y="168" text-anchor="end" fill="#ffffff" font-weight="700">F# 17,621</text>
  </g>

  <text x="80" y="208" font-size="12" fill="#475569">34 F# files across 5 engine projects · 32 C# engine implementations deleted · C# remainder is facades + app-only services</text>

  <!-- Cluster board -->
  <text x="80" y="252" font-size="14" font-weight="700" fill="#0f172a">Engine clusters on F# — and what verifies each</text>

  <g font-size="12">
    <!-- header -->
    <text x="90" y="278" font-weight="700" fill="#334155">cluster</text>
    <text x="330" y="278" font-weight="700" fill="#334155">F# engine</text>
    <text x="560" y="278" font-weight="700" fill="#334155">verified by</text>
    <line x1="80" y1="286" x2="840" y2="286" stroke="#cbd5e1"/>

    <text x="90" y="310" fill="#0f172a">Firewall + COM</text>
    <text x="330" y="310" fill="#92400e">Engines.Firewall</text>
    <text x="560" y="310" fill="#166534">ContainSelfTest — ALL PASS</text>

    <text x="90" y="334" fill="#0f172a">Site doctor (verdict / probe / fingerprint)</text>
    <text x="330" y="334" fill="#92400e">Engines.Diagnosis</text>
    <text x="560" y="334" fill="#166534">SiteDoctorSelfTest — ALL PASS</text>

    <text x="90" y="358" fill="#0f172a">Sysmon watch · archive · installer</text>
    <text x="330" y="358" fill="#92400e">Engines.Watch</text>
    <text x="560" y="358" fill="#166534">NetWatchSelfTest — ALL CHECKS PASSED</text>

    <text x="90" y="382" fill="#0f172a">DNS geo/org + idle reconciler + RDAP</text>
    <text x="330" y="382" fill="#92400e">Engines.Watch (Dns.fs · Rdap.fs)</text>
    <text x="560" y="382" fill="#166534">NetWatchSelfTest (idle batch) + DnsFeedSelfTest</text>

    <text x="90" y="406" fill="#0f172a">TCP capture · TLS decrypt · transmissions</text>
    <text x="330" y="406" fill="#92400e">Engines.Watch</text>
    <text x="560" y="406" fill="#166534">PyTraceSelfTest reassemble — PASS</text>

    <text x="90" y="430" fill="#0f172a">Provenance · task attribution · image spawn</text>
    <text x="330" y="430" fill="#92400e">Engines.Watch</text>
    <text x="560" y="430" fill="#166534">TaskAttributionSelfTest (live, parity with ii)</text>

    <text x="90" y="454" fill="#0f172a">MCP agent bridge + client registration</text>
    <text x="330" y="454" fill="#92400e">Engines.Bridge</text>
    <text x="560" y="454" fill="#166534">ProxyInstallSelfTest — PASSED</text>
  </g>

  <!-- What II added, ported forward -->
  <text x="80" y="508" font-size="14" font-weight="700" fill="#0f172a">autocommand-ii features ported into F# (the autoscope fork predated them)</text>
  <g font-size="12" fill="#475569">
    <text x="90" y="532">• full DNS geo architecture: /24 prefix cache, adaptive backoff, RDAP fallback, ResolveNow / RetryUnresolved / DescribeResolveState, idle reconciler</text>
    <text x="90" y="554">• RdapService ported fresh: block-keyed cache, IANA-bootstrap routing, three-layer throttling</text>
    <text x="90" y="576">• firewall v2 path-hash app blocks, RetireDeadAppBlockRulesAsync, StaleRules / CoverageNote inventory surfacing</text>
    <text x="90" y="598">• TlsKeylogStore instance core · QuietFor idle signal · ResolveStateText · BuildReportText · MCP stale-registration detection</text>
  </g>

  <text x="460" y="628" text-anchor="middle" font-size="11" fill="#94a3b8">Apache-2.0 · engines are app-agnostic (same codebase serves the AutoCommand / AutoScope / AutoTrack family)</text>
</svg>
