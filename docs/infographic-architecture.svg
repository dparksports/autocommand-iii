<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="620" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AutoCommand III — architecture</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#475569">the C# app shell drives F# core engines injected with the AutoCommand identity</text>

  <!-- UI layer -->
  <rect x="40" y="80" width="840" height="86" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="460" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">C# · WPF app  (AutoCommand.csproj)</text>
  <text x="460" y="130" text-anchor="middle" font-size="12" fill="#1e40af">views · dialogs · view-models · AgentConfirmWindow · App startup wires WatchConfig + BridgeHost</text>
  <text x="460" y="150" text-anchor="middle" font-size="12" fill="#1e40af">AgentToolRegistry (40+ AI tools, C#) · AgentProxy / AgentHost (deployment faces)</text>

  <line x1="460" y1="166" x2="460" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- C# services layer -->
  <rect x="40" y="198" width="840" height="86" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="460" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">C# · app services + thin facades  (core/)</text>
  <text x="460" y="248" text-anchor="middle" font-size="12" fill="#166534">firewall facade · bridge host (facades + IAgentTools adapter) · BITS watcher · telemetry rules ·</text>
  <text x="460" y="268" text-anchor="middle" font-size="12" fill="#166534">TLS-terminating intercept proxy · task scheduler · trace metrics · pytrace installer · RDAP consumers</text>

  <line x1="460" y1="284" x2="460" y2="314" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- F# engines layer -->
  <rect x="40" y="316" width="840" height="212" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">F# · core engines  (Engines/ — 5 projects · 34 files · ~17.6k lines)</text>

  <!-- engine boxes -->
  <g font-size="12" fill="#78350f">
    <rect x="60" y="360" width="156" height="76" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="138" y="382" text-anchor="middle" font-weight="700">Engines.Core</text>
    <text x="138" y="400" text-anchor="middle">AppIdentity</text>
    <text x="138" y="416" text-anchor="middle">IpClassification</text>
    <text x="138" y="432" text-anchor="middle">TrafficRow</text>

    <rect x="232" y="360" width="156" height="76" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="310" y="382" text-anchor="middle" font-weight="700">Engines.Firewall</text>
    <text x="310" y="400" text-anchor="middle">INetFwPolicy2 COM</text>
    <text x="310" y="416" text-anchor="middle">blocks · profiles</text>
    <text x="310" y="432" text-anchor="middle">baseline · undo ledger</text>

    <rect x="404" y="360" width="156" height="76" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="482" y="382" text-anchor="middle" font-weight="700">Engines.Diagnosis</text>
    <text x="482" y="400" text-anchor="middle">site verdict</text>
    <text x="482" y="416" text-anchor="middle">dual-shape TLS probe</text>
    <text x="482" y="432" text-anchor="middle">fingerprint · dep join</text>

    <rect x="576" y="360" width="156" height="76" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="654" y="382" text-anchor="middle" font-weight="700">Engines.Watch</text>
    <text x="654" y="400" text-anchor="middle">sysmon · sniffer · capture</text>
    <text x="654" y="416" text-anchor="middle">TLS decrypt · transmissions</text>
    <text x="654" y="432" text-anchor="middle">DNS+geo+RDAP · forensics</text>

    <rect x="748" y="360" width="120" height="76" rx="8" fill="#ffffff" stroke="#f59e0b"/>
    <text x="808" y="382" text-anchor="middle" font-weight="700">Engines.Bridge</text>
    <text x="808" y="400" text-anchor="middle">MCP loopback</text>
    <text x="808" y="416" text-anchor="middle">session + token</text>
    <text x="808" y="432" text-anchor="middle">client catalog</text>
  </g>

  <text x="460" y="468" text-anchor="middle" font-size="12" fill="#92400e">app-agnostic by construction — no app name, rule prefix, data path or port inside; every value injected</text>
  <text x="460" y="486" text-anchor="middle" font-size="12" fill="#92400e">%LOCALAPPDATA%\AutoCommand · AC-BLOCK rules · bridge port 47821 · MCP id "autocommand"</text>
  <text x="460" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">seams: IAgentTools · IAgentBridgeUI · TrafficRow · RowAdapter · static facades</text>

  <line x1="460" y1="528" x2="460" y2="556" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- OS layer -->
  <rect x="40" y="558" width="840" height="42" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="460" y="584" text-anchor="middle" font-size="13" fill="#334155">Windows — Sysmon ETW · Windows Firewall COM (strong-typed, no dynamic) · TCP table · WMI · BITS · Task Scheduler</text>
</svg>
